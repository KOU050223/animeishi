name = "animeishi-api"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
account_id = "996d4f5f54227fcc10dd15a2baee0a5b"

# Annict OAuth クライアント ID（公開可）。client_secret は Workers Secret として
# `wrangler secret put ANNICT_CLIENT_SECRET` で別途登録する（コミットしない）。
# ローカル開発では .dev.vars に ANNICT_CLIENT_ID / ANNICT_CLIENT_SECRET を置く。
[vars]
# ANNICT_CLIENT_ID = "<your-annict-client-id>"

# 画像フォールバックの定期解決（annict_works の未解決行を直接回す。
# issue #127 までは Queues 経由だったが ops 上限に即達したため廃止）。
[triggers]
crons = ["*/10 * * * *"]

# Sentry release 識別用。デプロイごとの version id / tag が
# env.CF_VERSION_METADATA に入る（animeishi-api@<id> を組み立てる）。
[version_metadata]
binding = "CF_VERSION_METADATA"

[[d1_databases]]
binding = "DB"
database_name = "animeishi-db"
database_id = "ae2dfdcb-2d1e-4436-97b4-552c6ca31ede"

# プロフィール画像（アバター）保存用 R2 バケット
[[r2_buckets]]
binding = "AVATARS"
bucket_name = "animeishi-avatars"

[env.production]
[env.production.vars]
ENVIRONMENT = "production"
ANNICT_CLIENT_ID = "-W-RsOBNzzbMB6R2ldaOl8J9M6t3rBRLLQdsqV-PBxo"
# CORS 許可オリジン（カンマ区切り）。"*" 始まりはサフィックス一致（プレビューデプロイ用）。
# 詳細は src/cors.ts および docs/04_deployment.md を参照。
ALLOWED_ORIGINS = "https://animeishi-web-production.uozumi05.workers.dev,*-animeishi-web-production.uozumi05.workers.dev,https://animeishi.uomi.dev,http://localhost:8081"

[env.production.triggers]
crons = ["*/10 * * * *"]

# version_metadata は env 間で継承されないため各 env にも定義する。
[env.production.version_metadata]
binding = "CF_VERSION_METADATA"

# 本番のみ invocation logs を有効化する（Workers Logs 自体は
# トップレベルの [observability.logs] で有効済み）。
[env.production.observability]
enabled = true

[[env.production.d1_databases]]
binding = "DB"
database_name = "animeishi-db"
database_id = "ae2dfdcb-2d1e-4436-97b4-552c6ca31ede"

[[env.production.r2_buckets]]
binding = "AVATARS"
bucket_name = "animeishi-avatars"

# PR プレビュー環境（animeishi-api-preview）。
# 本番 D1 / R2 / Queue とは別リソースを持ち、PR コードからの書き込みが
# 本番データに混入しないようにする。CI (preview-api.yml) は
# `wrangler versions upload --env preview --preview-alias pr-<N>` で
# PR ごとのプレビュー URL を発行する。
# 初回利用前に docs/04_deployment.md のブートストラップ手順
# （deploy + secret 登録）が必要。
[env.preview]
preview_urls = true

[env.preview.version_metadata]
binding = "CF_VERSION_METADATA"

[env.preview.vars]
ENVIRONMENT = "preview"
ANNICT_CLIENT_ID = "-W-RsOBNzzbMB6R2ldaOl8J9M6t3rBRLLQdsqV-PBxo"
# プレビュー web（<alias>-animeishi-web-production.*.workers.dev）からの
# クロスオリジンを許可する。
ALLOWED_ORIGINS = "https://animeishi-web-production.uozumi05.workers.dev,*-animeishi-web-production.uozumi05.workers.dev,http://localhost:8081"

# プレビューでは定期バッチ（image fallback 解決）を回さない。
[env.preview.triggers]
crons = []

[[env.preview.d1_databases]]
binding = "DB"
database_name = "animeishi-db-preview"
database_id = "a429fdc7-43da-4286-93c7-f946e1b4288e"

[[env.preview.r2_buckets]]
binding = "AVATARS"
bucket_name = "animeishi-avatars-preview"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
