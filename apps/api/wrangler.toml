name = "animeishi-api"
main = "src/index.ts"
compatibility_date = "2026-11-23"
compatibility_flags = ["nodejs_compat"]
account_id = "996d4f5f54227fcc10dd15a2baee0a5b"

# Annict OAuth クライアント ID（公開可）。client_secret は Workers Secret として
# `wrangler secret put ANNICT_CLIENT_SECRET` で別途登録する（コミットしない）。
# ローカル開発では .dev.vars に ANNICT_CLIENT_ID / ANNICT_CLIENT_SECRET を置く。
[vars]
# ANNICT_CLIENT_ID = "<your-annict-client-id>"

# 定期バッチ（cron）。
# 1. MAL ID を持たない作品の AniList タイトル検索（issue #223）。
# 2. 画像フォールバックの定期解決（annict_works の未解決行を直接回す。
#    issue #127 までは Queues 経由だったが ops 上限に即達したため廃止）。
# 作品画像の R2 取り込みは cron ではなく GET /images/works/:id が表示時に行う。
# cron は production env でのみ回す（issue #704）。
[triggers]
crons = []

# Sentry release 識別用。デプロイごとの version id / tag が
# env.CF_VERSION_METADATA に入る（animeishi-api@<id> を組み立てる）。
[version_metadata]
binding = "CF_VERSION_METADATA"

# デフォルト env（--env なし）はローカル開発・テスト専用で、本番 D1 / R2 には
# 繋がないダミーを置く。本番 ID にすると --env を付け忘れた deploy や
# d1 execute --remote が本番データに触れる（issue #712）。
# database_name を本番と同じにしているのは、`wrangler d1 ... animeishi-db` を
# --env なしで叩いたときに設定のダミー ID に解決させるため。設定に無い名前だと
# wrangler はアカウント内の DB 名で検索し、本番 DB に解決してしまう。
[[d1_databases]]
binding = "DB"
database_name = "animeishi-db"
database_id = "00000000-0000-0000-0000-000000000000"

# 画像保存用 R2 バケット。用途はオブジェクトキーのプレフィックスで分ける:
#   avatars/ … プロフィール画像（アバター）
#   works/   … 作品画像（GET /images/works/:id が表示時に外部から取り込む）
[[r2_buckets]]
binding = "AVATARS"
bucket_name = "animeishi-avatars-local"

# Workers AI（視聴傾向分析 POST /me/analysis, issue #22）。
# named env には継承されないため preview / production にも個別に定義する。
# AI binding はローカル推論を持たず wrangler dev でも常にリモート実行される
# （remote = true は不要。付けると vitest-pool-workers がリモートプロキシを
# 起こそうとして Cloudflare 認証を要求し、CI のテストが落ちる）。
[ai]
binding = "AI"

# デモアカウントのサインイン（src/features/demo-sign-in）のパスワード総当たり対策。
# IP とアカウントごとに 1 分 5 回まで。namespace_id はアカウント内で一意な数値。
[[ratelimits]]
name = "DEMO_SIGN_IN_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# 作品画像プロキシ（src/features/images）の ?r= によるキャッシュ回避の流量制限（issue #713）。
# IP ごとに 1 分 200 回まで。WorkImage は 1 枚につき最大 2 回リトライするため、
# 1 画面で数十枚がリトライしても収まる値にしている。
[[ratelimits]]
name = "IMAGE_RETRY_RATE_LIMITER"
namespace_id = "1004"
simple = { limit = 200, period = 60 }

# 書き込み系 API のユーザー単位の流量制限（issue #715）。
# 適用は src/middleware/rateLimit.ts で、キーは clerkUserId。
# Workers Rate Limiting の period は 10 / 60 秒しか選べないため、
# 通報 10 回/時・フィードバック 5 回/時のような時間単位の上限は
# 引き続き DB 側の既存制限（issue #148 等）が担い、こちらは
# バーストを Worker に到達する前に止める役割。
# 通報・フレンド申請は通常利用で分単位に 1〜2 件程度、いいねは一覧を
# 眺めながら連打しうる操作のため上限を高めにしている。
[[ratelimits]]
name = "REPORT_RATE_LIMITER"
namespace_id = "1007"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "FEEDBACK_RATE_LIMITER"
namespace_id = "1010"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "FRIEND_REQUEST_RATE_LIMITER"
namespace_id = "1013"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "LIKE_RATE_LIMITER"
namespace_id = "1016"
simple = { limit = 60, period = 60 }

# dアニメ話記録ジョブのバックグラウンド実行（issue #477）。
# POST /me/import/danime/episode-jobs がインスタンスを起動し、
# DanimeEpisodeImportWorkflow が対応付けと createRecord を行う。
# named env には継承されないため preview / production にも個別に定義する。
[[workflows]]
binding = "DANIME_EPISODE_IMPORT"
name = "danime-episode-import"
class_name = "DanimeEpisodeImportWorkflow"

[env.production]
[env.production.vars]
ENVIRONMENT = "production"
ANNICT_CLIENT_ID = "-W-RsOBNzzbMB6R2ldaOl8J9M6t3rBRLLQdsqV-PBxo"
# CORS 許可オリジン（カンマ区切り）。"*" 始まりはサフィックス一致（プレビューデプロイ用）。
# 詳細は src/cors.ts および docs/04_deployment.md を参照。
# localhost は本番では許可しない（開発は preview 環境か .dev.vars を使う）。
ALLOWED_ORIGINS = "https://animeishi-web-production.uozumi05.workers.dev,*-animeishi-web-production.uozumi05.workers.dev,https://animeishi.uomi.dev"
# Clerk azp 検証（authorizedParties）。azp クレームを持つトークン（ブラウザ発行）
# が許可オリジン発行か照合する。azp を持たないネイティブアプリのトークンは
# この設定に関わらず通過する。完全一致のみ（ワイルドカード不可）。
CLERK_AUTHORIZED_PARTIES = "https://animeishi.uomi.dev,https://animeishi-web-production.uozumi05.workers.dev"
# OGP HTML（GET /user/:uid）の「Web で見る」導線に使う Web 版のベース URL。
PUBLIC_WEB_URL = "https://animeishi.uomi.dev"

[env.production.triggers]
# 10 分おきだと未解決行の棚卸しクエリが annict_works を全行スキャンし続け、
# D1 無料枠の rows_read 上限に達したため 30 分おきに伸ばす（issue #704）。
crons = ["*/30 * * * *"]

# version_metadata は env 間で継承されないため各 env にも定義する。
[env.production.version_metadata]
binding = "CF_VERSION_METADATA"

# 本番のみ invocation logs を有効化する（Workers Logs 自体は
# トップレベルの [observability.logs] で有効済み）。
[env.production.observability]
enabled = true

[[env.production.d1_databases]]
binding = "DB"
database_name = "animeishi-db"
database_id = "ae2dfdcb-2d1e-4436-97b4-552c6ca31ede"

[[env.production.r2_buckets]]
binding = "AVATARS"
bucket_name = "animeishi-avatars"

# Discord 障害通知の重複抑止（src/lib/discordAlert.ts）。印を 30 分 TTL で置くだけ。
# Webhook URL は `wrangler secret put DISCORD_WEBHOOK_URL --env production` で登録する。
# preview / ローカルは Webhook を置かないため未バインド（通知自体が no-op）。
[[env.production.kv_namespaces]]
binding = "ALERT_STATE"
id = "fb229fd4fc634a53a2a0f30b912feb94"

[env.production.ai]
binding = "AI"

# デモアカウントのサインイン（src/features/demo-sign-in）のパスワード総当たり対策。
# IP とアカウントごとに 1 分 5 回まで。namespace_id はアカウント内で一意な数値。
[[env.production.ratelimits]]
name = "DEMO_SIGN_IN_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

# 作品画像の ?r= の流量制限。上限値の理由はデフォルト env の定義を参照。
[[env.production.ratelimits]]
name = "IMAGE_RETRY_RATE_LIMITER"
namespace_id = "1005"
simple = { limit = 200, period = 60 }

# 書き込み系 API のユーザー単位の流量制限（issue #715）。
# 用途・上限値の理由はデフォルト env の定義を参照。
[[env.production.ratelimits]]
name = "REPORT_RATE_LIMITER"
namespace_id = "1008"
simple = { limit = 10, period = 60 }

[[env.production.ratelimits]]
name = "FEEDBACK_RATE_LIMITER"
namespace_id = "1011"
simple = { limit = 5, period = 60 }

[[env.production.ratelimits]]
name = "FRIEND_REQUEST_RATE_LIMITER"
namespace_id = "1014"
simple = { limit = 20, period = 60 }

[[env.production.ratelimits]]
name = "LIKE_RATE_LIMITER"
namespace_id = "1017"
simple = { limit = 60, period = 60 }

[[env.production.workflows]]
binding = "DANIME_EPISODE_IMPORT"
name = "danime-episode-import"
class_name = "DanimeEpisodeImportWorkflow"

# PR プレビュー環境（animeishi-api-preview）。
# 本番 D1 / R2 / Queue とは別リソースを持ち、PR コードからの書き込みが
# 本番データに混入しないようにする。CI (preview-api.yml) は
# `wrangler versions upload --env preview --preview-alias pr-<N>` で
# PR ごとのプレビュー URL を発行する。
# 初回利用前に docs/04_deployment.md のブートストラップ手順
# （deploy + secret 登録）が必要。
[env.preview]
preview_urls = true

[env.preview.version_metadata]
binding = "CF_VERSION_METADATA"

[env.preview.vars]
ENVIRONMENT = "preview"
ANNICT_CLIENT_ID = "-W-RsOBNzzbMB6R2ldaOl8J9M6t3rBRLLQdsqV-PBxo"
# プレビュー web（<alias>-animeishi-web-production.*.workers.dev）からの
# クロスオリジンを許可する。
ALLOWED_ORIGINS = "https://animeishi-web-production.uozumi05.workers.dev,*-animeishi-web-production.uozumi05.workers.dev,http://localhost:8081"

# プレビューでは定期バッチ（image fallback 解決・作品画像の R2 取り込み）を回さない。
[env.preview.triggers]
crons = []

[[env.preview.d1_databases]]
binding = "DB"
database_name = "animeishi-db-preview"
database_id = "a429fdc7-43da-4286-93c7-f946e1b4288e"

[[env.preview.r2_buckets]]
binding = "AVATARS"
bucket_name = "animeishi-avatars-preview"

[env.preview.ai]
binding = "AI"

# デモアカウントのサインイン（src/features/demo-sign-in）のパスワード総当たり対策。
# IP とアカウントごとに 1 分 5 回まで。namespace_id はアカウント内で一意な数値。
[[env.preview.ratelimits]]
name = "DEMO_SIGN_IN_RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 5, period = 60 }

# 作品画像の ?r= の流量制限。上限値の理由はデフォルト env の定義を参照。
[[env.preview.ratelimits]]
name = "IMAGE_RETRY_RATE_LIMITER"
namespace_id = "1006"
simple = { limit = 200, period = 60 }

# 書き込み系 API のユーザー単位の流量制限（issue #715）。
# 用途・上限値の理由はデフォルト env の定義を参照。
[[env.preview.ratelimits]]
name = "REPORT_RATE_LIMITER"
namespace_id = "1009"
simple = { limit = 10, period = 60 }

[[env.preview.ratelimits]]
name = "FEEDBACK_RATE_LIMITER"
namespace_id = "1012"
simple = { limit = 5, period = 60 }

[[env.preview.ratelimits]]
name = "FRIEND_REQUEST_RATE_LIMITER"
namespace_id = "1015"
simple = { limit = 20, period = 60 }

[[env.preview.ratelimits]]
name = "LIKE_RATE_LIMITER"
namespace_id = "1018"
simple = { limit = 60, period = 60 }

# ワークフロー名はアカウント内で一意にする必要があるため env ごとに分ける
# （preview のインスタンスが production の実行中ジョブと混ざらないようにする）。
[[env.preview.workflows]]
binding = "DANIME_EPISODE_IMPORT"
name = "danime-episode-import-preview"
class_name = "DanimeEpisodeImportWorkflow"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
