    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* JS バンドル取得中の真っ白な画面を避けるプレースホルダー。
         SPA（web.output: "single"）では React の初回レンダリングで
         #root の子は置き換わる（issue #525）。静的出力へ切り替えるなら
         SSR HTML との hydration mismatch を避けるため取り除くこと。 */
      #boot-spinner {
        display: flex;
        flex: 1;
        height: 100%;
        align-items: center;
        justify-content: center;
      }
      #boot-spinner::after {
        content: "";
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 3px solid #c7d2fe;
        border-top-color: #4f46e5;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <!-- 検索エンジンのサイト名表示用（JSON-LD WebSite）。 -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

      </ul>
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"><div id="boot-spinner"></div></div>
  </body>
