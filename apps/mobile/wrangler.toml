# Web フロント（Expo Router の web エクスポート）を Cloudflare Workers の
# 静的アセットとして配信する設定。`expo export -p web` が dist/ に SPA を出力する。
# /share/* だけは worker/index.ts が API Worker へ転送し、
# API が返す OGP 付き共有ページをこのドメインで配信する（issue #408）。
name = "animeishi-web"
main = "worker/index.ts"
compatibility_date = "2025-04-01"
account_id = "996d4f5f54227fcc10dd15a2baee0a5b"
preview_urls = true

[assets]
directory = "./dist"
binding = "ASSETS"
# SPA のためクライアントサイドルーティングへ未知のパスをフォールバックする
not_found_handling = "single-page-application"
# Worker が関与するのは HTML ページに限る（アセット要求まで Worker へ
# 回すと全リクエストが invocation 課金・1 ホップ増になる）。
#   /share/* … 全員 API の OGP 付き静的 HTML へ転送（issue #408）
#   /user/*  … クローラ UA のみ API の OGP HTML へ転送、ブラウザは SPA
#   公開ページ … パス別メタを初期 HTML に注入
#   その他の HTML ルート … noindex メタを注入
# 新しいページ（app/ 以下のルート）を追加したらここにも登録する。
# 登録漏れでも従来どおり SPA として動くだけで、壊れはしない。
run_worker_first = [
  "/share/*",
  "/user/*",
  "/",
  "/welcome",
  "/privacy",
  "/terms",
  "/support",
  "/sign-in",
  "/sign-up",
  "/forgot-password",
  "/sso-callback",
  "/incoming-share",
  "/annict",
  "/meishi",
  "/meishi/*",
  "/qr",
  "/hiroba",
  "/library",
  "/profile",
  "/social",
  "/achievements",
  "/analysis",
  "/anime-list",
  "/article/*",
  "/blocked-users",
  "/changelog",
  "/character-tier-list",
  "/custom-tier-list",
  "/danime-import",
  "/danime-import-review",
  "/delete-account",
  "/election/*",
  "/event/*",
  "/favorites",
  "/feedback",
  "/friends",
  "/public-tier-list",
  "/public-work-list",
  "/tier-list",
  "/tier-lists",
  "/watch-history",
  "/work-list",
  "/work-lists",
  "/onboarding",
  "/passkey-prompt",
]

[vars]
# /share/* の転送時にリクエスト URL のオリジンを書き換える API の公開オリジン
# （worker/index.ts 参照）。Service Binding（env.API）が無い環境、または
# SHARE_FORWARD_VIA_FETCH が立つ環境（PR プレビュー）ではこのオリジンへの
# 通常 fetch で転送する。
API_ORIGIN = "https://animeishi-api.uomi.dev"

# [assets] は各 env に継承されるが、vars は継承されない。
# そのため API_ORIGIN は env ごとに書く必要がある（重複ではない）。
# env 側では転送先（サービス名・API_ORIGIN）と ENVIRONMENT だけを上書きする。
[env.production]
preview_urls = true

# 本番は Service Binding 経由で API Worker へ転送する。remote = true は
# `wrangler dev --env production` でローカル実行せずデプロイ済みの
# 本番 API を叩くための指定。
[[env.production.services]]
binding = "API"
service = "animeishi-api-production"
remote = true

[env.production.vars]
ENVIRONMENT = "production"
API_ORIGIN = "https://animeishi-api.uomi.dev"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
