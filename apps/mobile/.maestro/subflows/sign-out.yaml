# ホーム → プロフィールタブ → サインアウト → サインイン画面、までの部品。
# サインアウトは issue #395 Phase 4 でプロフィールの設定群末尾へ移動した。
appId: com.animeishi.app
---
# サインイン直後に iOS の「パスワードを保存しますか？」シートが
# 被さっているとタブをタップできないため、残っていれば閉じる。
- tapOn:
    text: 今はしない
    optional: true
    retryTapIfNoChange: false
- tapOn:
    id: profile-tab-button
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      text: ユーザー名入力
    timeout: 30000
# scrollUntilVisible はここでは動かない: zoomable な名刺プレビューが画面中央で
# RNGH の pan ジェスチャを掴むため、Maestro の "swipe from center" がそれに
# 食われてリストが全くスクロールしない（要素がヒエラルキーに出ない）。
# カードより下（画面高さの 65%）からの座標スワイプでスクロールしてから
# ボタンを待つ。カードは画面の ~57% までなので 65% は安全にその下。
- swipe:
    start: "50%, 65%"
    end: "50%, 20%"
- swipe:
    start: "50%, 65%"
    end: "50%, 20%"
- swipe:
    start: "50%, 65%"
    end: "50%, 20%"
- extendedWaitUntil:
    visible:
      id: sign-out-button
    timeout: 15000
- tapOn:
    id: sign-out-button
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: sign-in-button
    timeout: 30000
