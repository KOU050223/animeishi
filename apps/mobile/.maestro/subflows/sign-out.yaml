# ホーム → サインアウト → サインイン画面、までの部品。
appId: com.animeishi.app
---
# 画面下端ギリギリで止まるとタップがタブバーに被るため centerElement で中央まで出す。
# ただしボタンが最初から画面に収まっている（全体が収まり中央へ寄せられない）と
# スクロール自体が失敗するため optional にし、その場合は警告で終えてそのまま
# タップへ進む（issue #298）。ボタンが無い等の本当の失敗は後続の tapOn が拾う。
- scrollUntilVisible:
    element:
      id: sign-out-button
    direction: DOWN
    centerElement: true
    optional: true
- tapOn:
    id: sign-out-button
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: sign-in-button
    timeout: 30000
