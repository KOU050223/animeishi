# ホーム → サインアウト → サインイン画面、までの部品。
appId: com.animeishi.app
---
# 画面下端ギリギリで止まるとタップがタブバーに被るため centerElement で中央まで出す。
# ただしボタンが最初から画面に収まっていると scrollUntilVisible 自体が
# スクロールできずに失敗するため、見えているときはスキップする（issue #298）。
- runFlow:
    when:
      notVisible:
        id: sign-out-button
    commands:
      - scrollUntilVisible:
          element:
            id: sign-out-button
          direction: DOWN
          centerElement: true
- tapOn:
    id: sign-out-button
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      id: sign-in-button
    timeout: 30000
