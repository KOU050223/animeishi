# ホーム → プロフィールタブ → アカウント削除（二段階確認）までの部品。
# 削除ボタンは画面下部のため scrollUntilVisible で出す。
# Alert の「削除する」はシステムダイアログ上のボタンをテキストでタップする。
appId: com.animeishi.app
---
# サインイン直後に iOS の「パスワードを保存しますか？」シートが
# 被さっているとタブをタップできないため、残っていれば閉じる。
- tapOn:
    text: 今はしない
    optional: true
    retryTapIfNoChange: false
- tapOn:
    id: profile-tab-button
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      text: ユーザー名入力
    timeout: 30000
# scrollUntilVisible はここでは動かない: zoomable な名刺プレビューが画面中央で
# RNGH の pan ジェスチャを掴み、Maestro の "swipe from center" がリストを
# 動かせない（sign-out.yaml と同じ問題）。カードより下（65%）からの座標
# スワイプでリスト末尾までスクロールしてからボタンを待つ。
- swipe:
    start: "50%, 65%"
    end: "50%, 20%"
- swipe:
    start: "50%, 65%"
    end: "50%, 20%"
- swipe:
    start: "50%, 65%"
    end: "50%, 20%"
- extendedWaitUntil:
    visible:
      text: アカウントを削除
    timeout: 15000
- tapOn:
    text: アカウントを削除
    retryTapIfNoChange: false
# 1 段目「アカウントを削除しますか？」
- extendedWaitUntil:
    visible:
      text: 削除する
    timeout: 10000
- tapOn:
    text: 削除する
    retryTapIfNoChange: false
# 2 段目「最終確認」が出るまで待ってから「削除する」をタップする
- extendedWaitUntil:
    visible:
      text: 最終確認
    timeout: 10000
- tapOn:
    text: 削除する
    retryTapIfNoChange: false
