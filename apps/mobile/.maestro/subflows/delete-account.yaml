# ホーム → プロフィールタブ → アカウント削除（段階フロー）までの部品。
# 削除ボタンは画面下部のため scrollUntilVisible で出す。
# フローは /delete-account 画面の 3 ステップ（理由 → 消えるデータ → 最終確認）。
# 理由は任意入力なので E2E では「スキップ」で通過する。
appId: com.animeishi.app
---
# サインイン直後に iOS の「パスワードを保存しますか？」シートが
# 被さっているとタブをタップできないため、残っていれば閉じる。
- tapOn:
    text: 今はしない
    optional: true
    retryTapIfNoChange: false
- tapOn:
    id: profile-tab-button
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      text: ユーザー名入力
    timeout: 30000
# 画面下端ギリギリで止まるとタップがタブバーに被るため centerElement で中央まで出す。
# 削除ボタンはリスト末尾にあり中央へ寄せきれないため、Maestro はスクロールの
# リトライを繰り返す。ホスト高負荷時は各リトライが遅く既定の 20 秒を超えて
# タイムアウトするため、余裕を持たせる（issue #444）。
- scrollUntilVisible:
    element:
      text: アカウントを削除
    direction: DOWN
    centerElement: true
    timeout: 90000
- tapOn:
    text: アカウントを削除
    retryTapIfNoChange: false
# ステップ 1「退会理由」が出るまで待ってからスキップで通過する
- extendedWaitUntil:
    visible:
      text: スキップ
    timeout: 10000
- tapOn:
    text: スキップ
    retryTapIfNoChange: false
# ステップ 2「削除されるデータ」が出るまで待ってから次へ進む
- extendedWaitUntil:
    visible:
      text: 削除されるデータ
    timeout: 10000
- tapOn:
    text: 次へ
    retryTapIfNoChange: false
# ステップ 3「最終確認」が出るまで待ってから「削除する」をタップする
- extendedWaitUntil:
    visible:
      text: 最終確認
    timeout: 10000
- tapOn:
    text: 削除する
    retryTapIfNoChange: false
