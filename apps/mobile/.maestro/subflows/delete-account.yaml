# ホーム → プロフィールタブ → アカウント削除（段階フロー）までの部品。
# 削除ボタンは画面下部のため scrollUntilVisible で出す。
# フローは /delete-account 画面の 3 ステップ（理由 → 消えるデータ → 最終確認）。
# 理由は任意入力なので E2E では「スキップ」で通過する。
appId: com.animeishi.app
---
# サインイン直後に iOS の「パスワードを保存しますか？」シートが
# 被さっているとタブをタップできないため、残っていれば閉じる。
- tapOn:
    text: 今はしない
    optional: true
    retryTapIfNoChange: false
- tapOn:
    id: profile-tab-button
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible:
      text: ユーザー名入力
    timeout: 30000
# scrollUntilVisible はここでは動かない: zoomable な名刺プレビューが画面中央で
# RNGH の pan ジェスチャを掴み、Maestro の "swipe from center" がリストを
# 動かせない（sign-out.yaml と同じ問題）。カードより下（65%）からの座標
# スワイプでリスト末尾までスクロールしてからボタンを待つ。
- swipe:
    start: "50%, 65%"
    end: "50%, 20%"
- swipe:
    start: "50%, 65%"
    end: "50%, 20%"
- swipe:
    start: "50%, 65%"
    end: "50%, 20%"
- extendedWaitUntil:
    visible:
      text: アカウントを削除
    timeout: 15000
- tapOn:
    text: アカウントを削除
    retryTapIfNoChange: false
# ステップ 1「退会理由」が出るまで待ってからスキップで通過する
- extendedWaitUntil:
    visible:
      text: スキップ
    timeout: 10000
- tapOn:
    text: スキップ
    retryTapIfNoChange: false
# ステップ 2「削除されるデータ」が出るまで待ってから次へ進む
- extendedWaitUntil:
    visible:
      text: 削除されるデータ
    timeout: 10000
- tapOn:
    text: 次へ
    retryTapIfNoChange: false
# ステップ 3「最終確認」が出るまで待ってから「削除する」をタップする
- extendedWaitUntil:
    visible:
      text: 最終確認
    timeout: 10000
- tapOn:
    text: 削除する
    retryTapIfNoChange: false
