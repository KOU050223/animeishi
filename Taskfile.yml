# go-task タスクランナー。本番・プレビュー環境の運用操作だけを置く（issue #246）。
# 開発ループ（typecheck / lint / fmt / test / dev 等）はルートの vite.config.ts と
# 各 package.json の scripts に移し、`vp run` で実行する。
# go-task はルートの devDependency（@go-task/cli）で導入する。`vp install` 後に
# `pnpm task --list` で一覧を表示し、`pnpm task <タスク名>` で実行する。
version: "3"

tasks:
  default:
    cmds:
      - task --list
    silent: true

  worktree:env:
    desc: 新しい worktree にローカル用の秘密設定ファイルをコピー（既存は FORCE=1 で上書き）
    cmds:
      - |
        bash -c '
        set -eu
        if ! worktree_list=$(git worktree list --porcelain); then
          echo "エラー: git worktree list に失敗しました。" >&2
          exit 1
        fi
        source_root=$(printf "%s\n" "$worktree_list" | sed -n "1s/^worktree //p")
        if [ -z "$source_root" ]; then
          echo "エラー: メイン checkout のパスを取得できませんでした。" >&2
          exit 1
        fi
        target_root=$(pwd -P)
        if [ "$source_root" = "$target_root" ]; then
          echo "メインのチェックアウトで実行されたため、コピーはありません。"
          exit 0
        fi
        files="apps/mobile/.env apps/api/.dev.vars"
        for relative_path in $files; do
          source_file="$source_root/$relative_path"
          target_file="$target_root/$relative_path"
          if [ ! -f "$source_file" ]; then
            echo "警告: コピー元がありません: $source_file（.example から作成してください）" >&2
            continue
          fi
          if [ -e "$target_file" ] && [ "${FORCE:-0}" != "1" ]; then
            echo "スキップ（既存）: $relative_path"
            continue
          fi
          mkdir -p "$(dirname "$target_file")"
          temporary_file=$(mktemp "${target_file}.tmp.XXXXXX")
          if ! cp "$source_file" "$temporary_file"; then
            rm -f "$temporary_file"
            echo "エラー: コピーに失敗しました: $relative_path" >&2
            exit 1
          fi
          if ! mv "$temporary_file" "$target_file"; then
            rm -f "$temporary_file"
            echo "エラー: コピー先への配置に失敗しました: $relative_path" >&2
            exit 1
          fi
          echo "コピー: $relative_path"
        done
        '

  db:migrate:prod:list:
    desc: 本番 D1 の未適用マイグレーションを確認（適用はしない）
    dir: apps/api
    cmds:
      - pnpm wrangler d1 migrations list animeishi-db --remote --env production

  db:migrate:prod:
    desc: 本番 D1 にマイグレーションを適用（破壊的操作あり・確認プロンプト付き）
    dir: apps/api
    # 誤爆防止: 実行前に未適用一覧を見せて y/N で確認する。
    prompt: 本番 D1 にマイグレーションを適用します。0002 等の破壊的マイグレーションを含む場合データが失われます。続行しますか？
    cmds:
      # まず未適用の一覧を表示してから適用する。
      - pnpm wrangler d1 migrations list animeishi-db --remote --env production
      - pnpm wrangler d1 migrations apply animeishi-db --remote --env production

  db:migrate:preview:list:
    desc: プレビュー D1 の未適用マイグレーションを確認（適用はしない）
    dir: apps/api
    cmds:
      - pnpm wrangler d1 migrations list animeishi-db-preview --remote --env preview

  db:migrate:preview:
    desc: プレビュー D1 (animeishi-db-preview) にマイグレーションを適用
    dir: apps/api
    cmds:
      - pnpm wrangler d1 migrations list animeishi-db-preview --remote --env preview
      - pnpm wrangler d1 migrations apply animeishi-db-preview --remote --env preview

  # ---- 作品画像 ----
  images:backfill:
    desc: "本番の未取り込み作品画像を画像プロキシ経由で一括取り込み（BACKFILL_LIMIT=N で件数制限）"
    dir: apps/api
    cmds:
      - bash scripts/backfill-work-images.sh --env production {{.CLI_ARGS}}

  # MAL API 規約 3(e) の削除依頼対応（issue #241）。件数を表示してから
  # スクリプト自身が確認プロンプトを出すため、Taskfile 側の prompt: は付けない。
  # キャッシュ Purge 用の CLOUDFLARE_ZONE_ID / CLOUDFLARE_PURGE_API_TOKEN は
  # apps/api/.env（gitignore 済み）か実行シェルの環境変数で渡す（issue #244。
  # 手順は docs/runbook/production-tasks.md）。
  images:takedown:
    desc: "本番の作品画像を削除し、以後の補完を止める（task images:takedown -- <作品ID>... / -- --all-mal）"
    dir: apps/api
    interactive: true
    # dotenv は task の dir（apps/api）からの相対パス。
    dotenv: [".env"]
    cmds:
      - bash scripts/takedown-work-images.sh --env production {{.CLI_ARGS}}

  # ---- 不具合報告・ご意見（アプリ内フォーム）----
  # Discord には件数だけ通知するので、内容はここで読む。
  feedback:list:
    desc: "本番 D1 の不具合報告・ご意見を新しい順に表示（既定 50 件。--limit N）"
    dir: apps/api
    cmds:
      - bash scripts/feedback.sh --env production list {{.CLI_ARGS}}

  feedback:list:local:
    desc: "ローカル D1 の不具合報告・ご意見を表示"
    dir: apps/api
    cmds:
      - bash scripts/feedback.sh --local list {{.CLI_ARGS}}

  # ---- 通報モデレーション（issue #186）----
  # 管理画面・管理者 API は認可設計が未決のため、運営の操作手段は
  # scripts/reports.sh（wrangler d1 execute ベース）に集約する。
  # ステータス: open（未対応）/ resolved（対応済み）/ dismissed（却下）
  reports:list:
    desc: "本番 D1 の通報一覧を表示（既定: 未対応のみ。--status/--by-user で絞込・集計可）"
    dir: apps/api
    cmds:
      # 例: task reports:list -- --status all / task reports:list -- --by-user
      - bash scripts/reports.sh --env production list {{.CLI_ARGS}}

  reports:list:local:
    desc: "ローカル D1 の通報一覧を表示（既定: 未対応のみ）"
    dir: apps/api
    cmds:
      - bash scripts/reports.sh --local list {{.CLI_ARGS}}

  # 更新系は id・メモを CLI_ARGS ではなく env 変数で渡す。CLI_ARGS は
  # `sh -c` で再評価されるため、通報理由等をコピペしたメモ中の $(...) が
  # コマンド実行されてしまう（id も同様）。env はシェル解釈を通らない
  # 安全な経路。
  reports:resolve:
    desc: "本番の通報を対応済みにする（task reports:resolve NOTE='メモ' -- <id>）"
    dir: apps/api
    prompt: 本番 D1 の通報レコードを更新します。続行しますか？
    env:
      REPORT_ID: "{{.CLI_ARGS}}"
      REPORT_NOTE: '{{.NOTE | default ""}}'
    cmds:
      - bash scripts/reports.sh --env production resolve

  reports:dismiss:
    desc: "本番の通報を却下する（task reports:dismiss NOTE='メモ' -- <id>）"
    dir: apps/api
    prompt: 本番 D1 の通報レコードを更新します。続行しますか？
    env:
      REPORT_ID: "{{.CLI_ARGS}}"
      REPORT_NOTE: '{{.NOTE | default ""}}'
    cmds:
      - bash scripts/reports.sh --env production dismiss

  reports:reopen:
    desc: 本番の通報を未対応に戻す（task reports:reopen -- <id>）
    dir: apps/api
    prompt: 本番 D1 の通報レコードを更新します。続行しますか？
    env:
      REPORT_ID: "{{.CLI_ARGS}}"
    cmds:
      - bash scripts/reports.sh --env production reopen

  reports:update:local:
    desc: "ローカル D1 で reports.sh の全コマンドを実行（例: task reports:update:local ID=5 NOTE='メモ' -- resolve）"
    dir: apps/api
    env:
      REPORT_ID: '{{.ID | default ""}}'
      REPORT_NOTE: '{{.NOTE | default ""}}'
    cmds:
      - bash scripts/reports.sh --local {{.CLI_ARGS}}

  # ---- 公開一覧からのユーザー除外（issue #580）----
  # users.public_list_exclusion の確認・設定・解除は
  # scripts/public-list-exclusion.sh に集約する。
  # 値は除外の理由（demo / banned 等）、NULL は一覧に出す。
  users:excluded:
    desc: "本番で公開一覧から除外中のユーザー一覧を表示"
    dir: apps/api
    cmds:
      - bash scripts/public-list-exclusion.sh --env production list {{.CLI_ARGS}}

  users:excluded:local:
    desc: "ローカル D1 で公開一覧から除外中のユーザー一覧を表示"
    dir: apps/api
    cmds:
      - bash scripts/public-list-exclusion.sh --local list {{.CLI_ARGS}}

  # 更新系は reports:* と同じく id・理由を CLI_ARGS ではなく env 変数で渡す
  # （CLI_ARGS は `sh -c` で再評価されるため）。
  users:exclude:
    desc: "本番ユーザーを公開一覧から除外（task users:exclude REASON=demo -- <id>）"
    dir: apps/api
    prompt: 本番 D1 の users を更新します。続行しますか？
    env:
      EXCLUDE_USER_ID: "{{.CLI_ARGS}}"
      EXCLUDE_REASON: '{{.REASON | default ""}}'
    cmds:
      - bash scripts/public-list-exclusion.sh --env production exclude

  users:unexclude:
    desc: "本番ユーザーの公開一覧除外を解除（task users:unexclude -- <id>）"
    dir: apps/api
    prompt: 本番 D1 の users を更新します。続行しますか？
    env:
      EXCLUDE_USER_ID: "{{.CLI_ARGS}}"
    cmds:
      - bash scripts/public-list-exclusion.sh --env production unexclude

  users:exclusion:local:
    desc: "ローカル D1 で public-list-exclusion.sh の全コマンドを実行（例: task users:exclusion:local ID=user_xxx REASON=demo -- exclude）"
    dir: apps/api
    env:
      EXCLUDE_USER_ID: '{{.ID | default ""}}'
      EXCLUDE_REASON: '{{.REASON | default ""}}'
    cmds:
      - bash scripts/public-list-exclusion.sh --local {{.CLI_ARGS}}

  # ---- 特集記事（issue #437）----
  # frontmatter 付き Markdown を D1 に upsert する。形式は
  # docs/runbook/production-tasks.md と scripts/publish-article.mjs 冒頭の
  # コメントを参照。同じ slug は上書きされる（created_at は初回投入時のまま）。
  articles:publish:
    desc: "本番 D1 に記事を投入（task articles:publish -- <記事.md のパス>。同じ slug は上書き）"
    dir: apps/api
    prompt: 本番 D1 に記事を投入します（同じ slug の記事は上書きされます）。続行しますか？
    cmds:
      - node scripts/publish-article.mjs --env production {{.CLI_ARGS}}

  articles:publish:preview:
    desc: "プレビュー D1 に記事を投入（task articles:publish:preview -- <記事.md のパス>）"
    dir: apps/api
    cmds:
      - node scripts/publish-article.mjs --env preview {{.CLI_ARGS}}

  articles:publish:local:
    desc: "ローカル D1 に記事を投入（task articles:publish:local -- <記事.md のパス>）"
    dir: apps/api
    cmds:
      - node scripts/publish-article.mjs --local {{.CLI_ARGS}}

  # ---- イベント（issue #411）----
  # 特集記事と同じく frontmatter 付き Markdown を D1 に upsert する。形式は
  # docs/runbook/production-tasks.md と scripts/publish-event.mjs 冒頭の
  # コメントを参照。同じ slug は上書きされる（created_at は初回投入時のまま）。
  events:publish:
    desc: "本番 D1 にイベントを投入（task events:publish -- <イベント.md のパス>。同じ slug は上書き）"
    dir: apps/api
    prompt: 本番 D1 にイベントを投入します（同じ slug のイベントは上書きされます）。続行しますか？
    cmds:
      - node scripts/publish-event.mjs --env production {{.CLI_ARGS}}

  events:publish:preview:
    desc: "プレビュー D1 にイベントを投入（task events:publish:preview -- <イベント.md のパス>）"
    dir: apps/api
    cmds:
      - node scripts/publish-event.mjs --env preview {{.CLI_ARGS}}

  events:publish:local:
    desc: "ローカル D1 にイベントを投入（task events:publish:local -- <イベント.md のパス>）"
    dir: apps/api
    cmds:
      - node scripts/publish-event.mjs --local {{.CLI_ARGS}}

  # ---- 総選挙（issue #438）----
  # 特集記事・イベントと同じく frontmatter 付き Markdown を D1 に upsert する。
  # 形式は docs/runbook/production-tasks.md と scripts/publish-election.mjs
  # 冒頭のコメントを参照。同じ slug は上書きされる（created_at は初回投入時
  # のまま。frontmatter から消した候補は、その候補への票ごと削除される）。
  elections:publish:
    desc: "本番 D1 に総選挙を投入（task elections:publish -- <選挙.md のパス>。同じ slug は上書き）"
    dir: apps/api
    prompt: 本番 D1 に総選挙を投入します（同じ slug の総選挙は上書きされ、frontmatter から消した候補は票ごと削除されます）。続行しますか？
    cmds:
      - node scripts/publish-election.mjs --env production {{.CLI_ARGS}}

  elections:publish:preview:
    desc: "プレビュー D1 に総選挙を投入（task elections:publish:preview -- <選挙.md のパス>）"
    dir: apps/api
    cmds:
      - node scripts/publish-election.mjs --env preview {{.CLI_ARGS}}

  elections:publish:local:
    desc: "ローカル D1 に総選挙を投入（task elections:publish:local -- <選挙.md のパス>）"
    dir: apps/api
    cmds:
      - node scripts/publish-election.mjs --local {{.CLI_ARGS}}

  # 結果の集計（読み取り専用）。途中経過はユーザーには出さない。
  elections:results:
    desc: "本番 D1 の総選挙結果を集計して表示（task elections:results -- <slug>）"
    dir: apps/api
    cmds:
      - bash scripts/election-results.sh --env production {{.CLI_ARGS}}

  elections:results:preview:
    desc: "プレビュー D1 の総選挙結果を集計して表示（task elections:results:preview -- <slug>）"
    dir: apps/api
    cmds:
      - bash scripts/election-results.sh --env preview {{.CLI_ARGS}}

  elections:results:local:
    desc: "ローカル D1 の総選挙結果を集計して表示（task elections:results:local -- <slug>）"
    dir: apps/api
    cmds:
      - bash scripts/election-results.sh --local {{.CLI_ARGS}}

  # ---- ゲストアカウント（App Store 審査のデモアカウント兼 Expo Explore のログイン用）----
  # Clerk 本番インスタンスにアカウントを作り、本番 API にデモデータを入れる（冪等）。
  # sk_live とパスワードは apps/api/.env（gitignore 済み）か実行シェルの環境変数で渡す。
  # 手順は docs/runbook/production-tasks.md。
  review-account:seed:
    desc: "本番にゲストアカウントを作成・更新してデモデータを入れる（冪等。確認プロンプト付き）"
    dir: apps/api
    dotenv: [".env"]
    prompt: 本番の Clerk と API にゲストアカウントを作成・更新します（パスワードは REVIEW_ACCOUNT_PASSWORD に揃えます）。続行しますか？
    cmds:
      - node scripts/review-account.mjs
