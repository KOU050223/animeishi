# go-task タスクランナー。本番・プレビュー環境の運用操作だけを置く（issue #246）。
# 開発ループ（typecheck / lint / fmt / test / dev 等）はルートの vite.config.ts と
# 各 package.json の scripts に移し、`vp run` で実行する。
# go-task はルートの devDependency（@go-task/cli）で導入する。`vp install` 後に
# `pnpm task --list` で一覧を表示し、`pnpm task <タスク名>` で実行する。
version: "3"

tasks:
  default:
    cmds:
      - task --list
    silent: true

  db:migrate:prod:list:
    desc: 本番 D1 の未適用マイグレーションを確認（適用はしない）
    dir: apps/api
    cmds:
      - pnpm wrangler d1 migrations list animeishi-db --remote --env production

  db:migrate:prod:
    desc: 本番 D1 にマイグレーションを適用（破壊的操作あり・確認プロンプト付き）
    dir: apps/api
    # 誤爆防止: 実行前に未適用一覧を見せて y/N で確認する。
    prompt: 本番 D1 にマイグレーションを適用します。0002 等の破壊的マイグレーションを含む場合データが失われます。続行しますか？
    cmds:
      # まず未適用の一覧を表示してから適用する。
      - pnpm wrangler d1 migrations list animeishi-db --remote --env production
      - pnpm wrangler d1 migrations apply animeishi-db --remote --env production

  db:migrate:preview:list:
    desc: プレビュー D1 の未適用マイグレーションを確認（適用はしない）
    dir: apps/api
    cmds:
      - pnpm wrangler d1 migrations list animeishi-db-preview --remote --env preview

  db:migrate:preview:
    desc: プレビュー D1 (animeishi-db-preview) にマイグレーションを適用
    dir: apps/api
    cmds:
      - pnpm wrangler d1 migrations list animeishi-db-preview --remote --env preview
      - pnpm wrangler d1 migrations apply animeishi-db-preview --remote --env preview

  # ---- 作品画像 ----
  images:backfill:
    desc: "本番の未取り込み作品画像を画像プロキシ経由で一括取り込み（BACKFILL_LIMIT=N で件数制限）"
    dir: apps/api
    cmds:
      - bash scripts/backfill-work-images.sh --env production {{.CLI_ARGS}}

  # MAL API 規約 3(e) の削除依頼対応（issue #241）。件数を表示してから
  # スクリプト自身が確認プロンプトを出すため、Taskfile 側の prompt: は付けない。
  images:takedown:
    desc: "本番の作品画像を削除し、以後の補完を止める（task images:takedown -- <作品ID>... / -- --all-mal）"
    dir: apps/api
    interactive: true
    cmds:
      - bash scripts/takedown-work-images.sh --env production {{.CLI_ARGS}}

  # ---- 通報モデレーション（issue #186）----
  # 管理画面・管理者 API は認可設計が未決のため、運営の操作手段は
  # scripts/reports.sh（wrangler d1 execute ベース）に集約する。
  # ステータス: open（未対応）/ resolved（対応済み）/ dismissed（却下）
  reports:list:
    desc: "本番 D1 の通報一覧を表示（既定: 未対応のみ。--status/--by-user で絞込・集計可）"
    dir: apps/api
    cmds:
      # 例: task reports:list -- --status all / task reports:list -- --by-user
      - bash scripts/reports.sh --env production list {{.CLI_ARGS}}

  reports:list:local:
    desc: "ローカル D1 の通報一覧を表示（既定: 未対応のみ）"
    dir: apps/api
    cmds:
      - bash scripts/reports.sh --local list {{.CLI_ARGS}}

  # 更新系は id・メモを CLI_ARGS ではなく env 変数で渡す。CLI_ARGS は
  # `sh -c` で再評価されるため、通報理由等をコピペしたメモ中の $(...) が
  # コマンド実行されてしまう（id も同様）。env はシェル解釈を通らない
  # 安全な経路。
  reports:resolve:
    desc: "本番の通報を対応済みにする（task reports:resolve NOTE='メモ' -- <id>）"
    dir: apps/api
    prompt: 本番 D1 の通報レコードを更新します。続行しますか？
    env:
      REPORT_ID: "{{.CLI_ARGS}}"
      REPORT_NOTE: '{{.NOTE | default ""}}'
    cmds:
      - bash scripts/reports.sh --env production resolve

  reports:dismiss:
    desc: "本番の通報を却下する（task reports:dismiss NOTE='メモ' -- <id>）"
    dir: apps/api
    prompt: 本番 D1 の通報レコードを更新します。続行しますか？
    env:
      REPORT_ID: "{{.CLI_ARGS}}"
      REPORT_NOTE: '{{.NOTE | default ""}}'
    cmds:
      - bash scripts/reports.sh --env production dismiss

  reports:reopen:
    desc: 本番の通報を未対応に戻す（task reports:reopen -- <id>）
    dir: apps/api
    prompt: 本番 D1 の通報レコードを更新します。続行しますか？
    env:
      REPORT_ID: "{{.CLI_ARGS}}"
    cmds:
      - bash scripts/reports.sh --env production reopen

  reports:update:local:
    desc: "ローカル D1 で reports.sh の全コマンドを実行（例: task reports:update:local ID=5 NOTE='メモ' -- resolve）"
    dir: apps/api
    env:
      REPORT_ID: '{{.ID | default ""}}'
      REPORT_NOTE: '{{.NOTE | default ""}}'
    cmds:
      - bash scripts/reports.sh --local {{.CLI_ARGS}}
