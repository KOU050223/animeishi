name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Vite+（vp）と Node.js（.node-version）・pnpm（packageManager）を用意し、vp install まで行う
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: 1.4.0
          node-version-file: .node-version
          cache: true

      - name: Run tests
        run: vp run --filter @animeishi/api test

      - name: TypeScript check
        run: vp run --filter @animeishi/api typecheck

  deploy:
    name: Deploy to Cloudflare Workers
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Vite+（vp）と Node.js（.node-version）・pnpm（packageManager）を用意し、vp install まで行う
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: 1.4.0
          node-version-file: .node-version
          cache: true

      # マイグレーションをデプロイ前に適用する。
      # 新カラム追加 → 新コード配信の順にすることで、デプロイ直後のスキーマ不整合を防ぐ。
      - name: Apply D1 migrations (production)
        run: pnpm --filter @animeishi/api exec wrangler d1 migrations apply animeishi-db --env production --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # COMMIT_SHA は --var で注入し、/health が返すバージョン情報に使う
      # （wrangler.toml の vars には書けないデプロイごとの動的値）。
      - name: Deploy
        run: pnpm --filter @animeishi/api exec wrangler deploy --env production --var COMMIT_SHA:${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
