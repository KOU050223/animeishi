name: Preview API

# PR ごとに API のプレビューバージョンを発行する。
# paths は preview-web.yml と揃える: Web プレビューはビルド時に
# pr-<N>-animeishi-api-preview の URL を埋め込むため、
# Web プレビューが走る PR では必ずこの alias も作成されている必要がある。
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/mobile/**"
      - "apps/api/**"
      - ".github/workflows/preview-api.yml"
      - ".github/workflows/preview-web.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"

permissions:
  contents: read

concurrency:
  group: preview-api-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # 前回の push で preview D1 に当たったマイグレーションを書き換えていないかを見る。
  # wrangler はファイル名でしか適用済みを判断しないため、書き換え・改名は
  # preview D1 に当たらないまま残る（issue #515）。
  # デプロイとジョブを分けているのは、preview D1 を手で直した後に再実行しても
  # 同じ差分で落ち続け、プレビューの発行まで止めてしまうため。
  # 前回の commit が取れないときに成功扱いにしないのは、amend して force push した場合こそ
  # 検出したい書き換えであり、fetch-depth: 0 でも到達不能な commit は取得されないため。
  migration-drift:
    name: Check migrations changed since last push
    if: github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check migrations
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$BEFORE" || true
          fi
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "::error::前回の push の commit（$BEFORE）が取得できず、マイグレーションの書き換えを確認できません。preview D1 の状態を docs/runbook/production-tasks.md の「preview D1 のずれを直す」の手順 1 で確認してください。"
            exit 1
          fi
          bash apps/api/scripts/check-migrations.sh "$BEFORE"

  deploy-preview:
    name: Deploy Cloudflare Workers Preview
    # Dependabot の PR には Actions secrets（CLOUDFLARE_API_TOKEN）が渡らないためスキップする
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Vite+（vp）と Node.js（package.json の devEngines.runtime）・pnpm（packageManager）を用意し、vp install まで行う
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true

      # マイグレーションを version upload 前に適用する（本番デプロイと同じ順序）。
      # 適用先は本番とは別の preview 専用 D1（animeishi-db-preview）。
      # 失敗はジョブの失敗にする。以前は同時期の PR 同士の衝突を見込んで警告で済ませていたが、
      # 警告は誰も見ず、1 週間すべての PR で失敗し続けた（issue #515）。
      # 衝突で落ちたときの直し方は docs/runbook/production-tasks.md の「preview D1 のずれを直す」。
      - name: Apply D1 migrations (preview)
        run: pnpm --filter @animeishi/api exec wrangler d1 migrations apply animeishi-db-preview --env preview --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # animeishi-api-preview のライブデプロイは更新せず、
      # https://pr-<N>-animeishi-api-preview.<subdomain>.workers.dev の
      # preview URL だけを発行する。
      - name: Upload preview version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_ALIAS: pr-${{ github.event.pull_request.number }}
          # /share/* の OGP HTML の og:url / canonical のベース。Web プレビュー
          # Worker が転送時にオリジンを API 側へ書き換えるため、未設定だと
          # 正規 URL が API プレビューのホストを指してしまう（issue #408）。
          PUBLIC_WEB_URL: https://pr-${{ github.event.pull_request.number }}-animeishi-web-production.${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN || 'uozumi05' }}.workers.dev
        # COMMIT_SHA は --var で注入し、/health が返すバージョン情報に使う
        run: pnpm --filter @animeishi/api exec wrangler versions upload --env preview --preview-alias "$PREVIEW_ALIAS" --var COMMIT_SHA:${{ github.sha }} --var "PUBLIC_WEB_URL:$PUBLIC_WEB_URL"
