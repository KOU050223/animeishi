name: Preview API

# PR ごとに API のプレビューバージョンを発行する。
# paths は preview-web.yml と揃える: Web プレビューはビルド時に
# pr-<N>-animeishi-api-preview の URL を埋め込むため、
# Web プレビューが走る PR では必ずこの alias も作成されている必要がある。
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/mobile/**"
      - "services/api/**"
      - ".github/workflows/preview-api.yml"
      - ".github/workflows/preview-web.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"

permissions:
  contents: read

concurrency:
  group: preview-api-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Deploy Cloudflare Workers Preview
    # Dependabot の PR には Actions secrets（CLOUDFLARE_API_TOKEN）が渡らないためスキップする
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Vite+（vp）と Node.js（package.json の devEngines.runtime）・pnpm（packageManager）を用意し、vp install まで行う
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version: 1.4.0
          cache: true

      # マイグレーションを version upload 前に適用する（本番デプロイと同じ順序）。
      # 適用先は本番とは別の preview 専用 D1（animeishi-db-preview）。
      # preview D1 は全 PR で共有のため、同時期の PR 同士で同じテーブル/カラムを
      # 触る移行は SQL レベルで衝突し得る。失敗しても version upload は続行し、
      # 警告として可視化する（新スキーマ依存のエンドポイントのみ動かない状態）。
      - name: Apply D1 migrations (preview)
        id: migrate
        continue-on-error: true
        run: pnpm --filter @animeishi/api exec wrangler d1 migrations apply animeishi-db-preview --env preview --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Warn if migrations failed
        if: steps.migrate.outcome == 'failure'
        run: |
          echo "::warning::preview D1 へのマイグレーション適用に失敗しました。別 PR のマイグレーションと衝突している可能性があります。新スキーマに依存するエンドポイントは API プレビュー上で動作しません。"

      # animeishi-api-preview のライブデプロイは更新せず、
      # https://pr-<N>-animeishi-api-preview.<subdomain>.workers.dev の
      # preview URL だけを発行する。
      - name: Upload preview version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_ALIAS: pr-${{ github.event.pull_request.number }}
        # COMMIT_SHA は --var で注入し、/health が返すバージョン情報に使う
        run: pnpm --filter @animeishi/api exec wrangler versions upload --env preview --preview-alias "$PREVIEW_ALIAS" --var COMMIT_SHA:${{ github.sha }}
