name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Vite Task のキャッシュ（issue #253、https://viteplus.dev/guide/github-actions-cache）
#
# vp run の typecheck / lint / fmt:check / test はタスクの結果を node_modules/.vite/task-cache に
# 残す。これを actions/cache で次の実行に持ち越し、入力の変わらないタスクを再生で済ませる。
# 何を再実行するかは Vite Task が入力ファイルのフィンガープリントで判断するため、
# Actions のキーにはソースや lockfile を入れない（入れると有用な復元まで外れる）。
#
# - キー: vite-task-<ジョブ>-<OS>-<arch>-<run_id>-<run_attempt>。エントリは上書きできないので
#   実行ごとに新しいキーで保存し、restore-keys の前方一致で最新のものを復元する。
#   ジョブごとに走らせるタスクが違うため、ジョブ名で分けて他ジョブの分を拾わないようにする。
# - 対象は Test と Lint & Type Check。Format Check の oxfmt は 1 秒程度で、キャッシュの復元・保存の
#   時間と相殺されるため入れていない（PR #258 で計測）。
# - 共有範囲: ブランチ名はキーに入れず、GitHub Actions cache のスコープに任せる。
#   main への push で保存したものは全 PR から読める。PR で保存したものは
#   refs/pull/<番号>/merge のスコープに入り、その PR の後続の push・再実行からしか読めない
#   （main や他の PR からは見えないので、PR が main のキャッシュを汚すことはない）。
#   フォーク PR はトークンが読み取り専用で、保存ステップは警告を出して成功扱いで終わる。
# - キャッシュするタスクはクリーンな環境変数（PATH・HOME・CI 等）で動くため、
#   このワークフローの env がタスクの結果に影響することはない。

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Vite+（vp）と Node.js（package.json の devEngines.runtime）・pnpm（packageManager）を用意し、vp install まで行う
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          cache: true

      # Vite Task のキャッシュ（node_modules/.vite/task-cache）を復元する（issue #253）。
      # vp install が node_modules を作り直すため setup-vp の後に置く。キーはファイル冒頭のコメントを参照。
      - name: Restore Vite Task cache
        id: vite-task-cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-test-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-test-${{ runner.os }}-${{ runner.arch }}-

      - name: Run tests
        run: vp run test

      - name: Save Vite Task cache
        if: success()
        uses: actions/cache/save@v6
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.vite-task-cache.outputs.cache-primary-key }}

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Vite+（vp）と Node.js（package.json の devEngines.runtime）・pnpm（packageManager）を用意し、vp install まで行う
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          cache: true

      # Vite Task のキャッシュ（node_modules/.vite/task-cache）を復元する（issue #253）。
      # vp install が node_modules を作り直すため setup-vp の後に置く。キーはファイル冒頭のコメントを参照。
      - name: Restore Vite Task cache
        id: vite-task-cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-lint-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-lint-${{ runner.os }}-${{ runner.arch }}-

      - name: TypeScript check
        run: vp run typecheck

      # 一時的な併走（issue #248）: TypeScript 6（tsc6）でも型チェックし、TypeScript 7 と結果・時間を比べる。
      # 比較が済んだらこのステップは外す
      - name: TypeScript check (tsc6, comparison)
        run: |
          for d in apps/mobile services/api packages/danime-core packages/observability; do
            echo "::group::$d"
            echo "tsc6 --noEmit"; time vp -C "$d" exec tsc6 --noEmit
            echo "tsc --noEmit --checkers 1"; time vp -C "$d" exec tsc --noEmit --checkers 1
            echo "tsc --noEmit"; time vp -C "$d" exec tsc --noEmit
            echo "::endgroup::"
          done

      - name: Oxlint check
        run: vp run lint

      - name: Save Vite Task cache
        if: success()
        uses: actions/cache/save@v6
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.vite-task-cache.outputs.cache-primary-key }}

  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Vite+（vp）と Node.js（package.json の devEngines.runtime）・pnpm（packageManager）を用意し、vp install まで行う
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          cache: true

      - name: Oxfmt check
        run: vp run fmt:check
